#
# To publish a new version of the PDK
# git tag pdk/v1.2.3
# git push origin pdk/v1.2.3
#
# To re-assign a tag to a different commit (e.g. on failed build),
# delete it and re-run the previous commands:
# git tag -d pdk/v1.2.3
# git push origin :refs/tags/pdk/v1.2.3
#
name: Publish PDK

on:
  push:
    tags:
      - "pdk/v*.*.*"

jobs:
  publish-pdk:
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # enable GitHub OIDC token issuance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      #- name: Test
      #  run: |
      #    dotnet test ./src/plugins/Pulse.Plugin.Tests/Pulse.Plugin.Tests.csproj \
      #      --configuration Release \
      #      --no-restore \
      #      --verbosity normal

      - name: Tag to version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#pdk/v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid PDK version tag: $TAG"
            echo "Expected format: pdk/v1.2.3 or pdk/v1.2.3-preview.1"
            exit 1
          fi

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pack
        run: >
          dotnet pack ./src/plugins/Pulse.Plugin/Pulse.Plugin.csproj
          -c Release
          -o ./artifacts
          /p:Version=${{ env.PACKAGE_VERSION }}

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{steps.login.outputs.NUGET_API_KEY}}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
